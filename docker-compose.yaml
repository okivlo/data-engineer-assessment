services:
  database:
    image: mysql:8.0
    platform: linux/amd64
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"    # Insurance.
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=codetest
      - MYSQL_USER=codetest
      - MYSQL_PASSWORD=swordfish
    ports:
      - "3306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro    # Initialize schemas in the db folder.
    healthcheck:
      # Didn't want to do this in the python code, lol. Cleaner to do it here.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucodetest", "-pswordfish"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  etl:
    build: image
    command: ["python", "etl.py"]
    volumes:
      - ./data:/data:ro
    depends_on:
      database:
        condition: service_healthy